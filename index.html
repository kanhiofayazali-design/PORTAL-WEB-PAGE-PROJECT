
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Information Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>Personal Information Portal</h1>
            <p>Manage your personal information</p>
        </header>

        <main class="form-container">

            <div class="form-heading">
                <h2>Personal Profile</h2>
                <p>Please provide your information below.</p>
            </div>

            <form>

                <h3>Personal Details</h3>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label>Father's Name</label>
                    <input type="text" placeholder="Enter father's name">
                </div>

                <div class="form-group">
                    <label>CNIC Number</label>
                    <input type="text" placeholder="Enter CNIC number">
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <h3>Contact Information</h3>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" placeholder="Enter mobile number">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="Enter your city">
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea placeholder="Enter your complete address"></textarea>
                </div>

                <div class="buttons">
                    <button type="button" class="submit-btn">
                        Submit Information
                    </button>

                    <button type="reset" class="reset-btn">
                        Reset Form
                    </button>
                </div>

            </form>

        </main>

        <footer>
            <p>Personal Information Portal | 2026</p>
        </footer>

    </div>

</body>
</html>
